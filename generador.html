<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador JSON | AlexDHZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background: #fdfdfd; padding: 40px 20px; color: #333; display: flex; justify-content: center; }
        .contenedor { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); width: 100%; max-width: 600px; border: 1px solid #eaeaea; }
        h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        label { display: block; margin-top: 20px; font-size: 10px; font-weight: bold; color: #999; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px 0; margin-top: 8px; border: none; border-bottom: 1px solid #ddd; box-sizing: border-box; font-size: 14px; outline: none; transition: 0.3s; font-family: 'Lato', sans-serif; }
        input:focus { border-color: #000; }
        button { width: 100%; padding: 16px; background: #000; color: #fff; border: none; cursor: pointer; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; margin-top: 30px; transition: 0.4s; }
        button:hover { background: #333; letter-spacing: 4px; }
        textarea { width: 100%; height: 250px; margin-top: 15px; padding: 15px; border: 1px solid #eee; background: #fafafa; font-family: monospace; font-size: 11px; color: #555; box-sizing: border-box; resize: vertical; outline: none; }
        .btn-copiar { background: #fff; color: #000; border: 1px solid #000; margin-top: 15px; }
        .btn-copiar:hover { background: #000; color: #fff; }
        #resultado { display: none; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .info-id { font-size: 11px; color: #000; font-style: italic; margin-bottom: 10px; display: block; text-align: center; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Extractor de Fotos</h2>
        <p style="font-size: 13px; color: #666; text-align: center; margin-bottom: 30px;">Pega el enlace completo de la carpeta pública de Google Drive.</p>
        
        <label>URL Completa de Google Drive</label>
        <input type="text" id="driveUrl" placeholder="Ej: https://drive.google.com/drive/folders/1xqyPdl...">
        
        <button id="btnExtraer" onclick="extraerFotos()">Sincronizar y Generar</button>

        <div id="resultado">
            <span id="id-detectado" class="info-id"></span>
            <label>Array JSON (Listo para tu index.html):</label>
            <textarea id="codigo-json" readonly></textarea>
            <button class="btn-copiar" onclick="copiarJson()">Copiar al Portapapeles</button>
        </div>
    </div>

    <script>
        // TU NUEVO SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxT86o_R8xX_H3TDs1vzwTNEfxtv8kqmnAXJWJJJ2Obrzl7pWEufqnU5o7SrQpjqOU/exec";

        function obtenerIdDeUrl(url) {
            let id = url.trim();
            const matchFolders = id.match(/\/folders\/([a-zA-Z0-9_-]+)/);
            if (matchFolders) return matchFolders[1];
            const matchId = id.match(/id=([a-zA-Z0-9_-]+)/);
            if (matchId) return matchId[1];
            return id;
        }

        async function extraerFotos() {
            const urlInput = document.getElementById('driveUrl').value;
            const btn = document.getElementById('btnExtraer');
            
            if(!urlInput) return alert("Ingresa el enlace de la carpeta.");
            const folderId = obtenerIdDeUrl(urlInput);

            btn.innerText = "Extrayendo...";
            btn.disabled = true;

            try {
                const response = await fetch(`${WEB_APP_URL}?folder=${folderId}`);
                const fotos = await response.json();

                if(fotos.error) throw new Error(fotos.error);

                document.getElementById('id-detectado').innerText = `ID: ${folderId} | ${fotos.length} fotos detectadas`;
                document.getElementById('codigo-json').value = JSON.stringify(fotos, null, 4);
                document.getElementById('resultado').style.display = "block";
                
                btn.innerText = "¡Completado!";
                setTimeout(() => { btn.innerText = "Sincronizar y Generar"; btn.disabled = false; }, 2000);
            } catch (err) {
                alert("Error al extraer. Revisa los permisos de la carpeta.");
                btn.innerText = "Sincronizar y Generar";
                btn.disabled = false;
            }
        }

        function copiarJson() {
            const textarea = document.getElementById('codigo-json');
            textarea.select();
            document.execCommand('copy');
            alert("¡Código copiado!");
        }
    </script>
</body>
</html>
