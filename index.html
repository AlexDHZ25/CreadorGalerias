<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="html-title">Cargando...</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1hpQGY_QfG4VAE4g8VJRTAYAXUWE-XtOB&sz=w32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root { --url-portada: none; }
      .header-galeria::before { background-image: var(--url-portada) !important; background-color: #111; }
    </style>
</head>
<body>

    <div class="header-galeria" id="header-portada">
      <div class="titulo" id="txt-titulo">...</div>
      <div class="subtitulo" id="txt-subtitulo">Cargando</div>
      <img src="https://drive.google.com/thumbnail?id=1hpQGY_QfG4VAE4g8VJRTAYAXUWE-XtOB&sz=w200" class="logo-header" alt="Logo">
    </div>

    <div class="barra-acciones" id="barra-acciones" style="display: none;">
      <button id="btn-ver-favoritos" class="btn-accion">FAVORITOS</button>
    </div>

    <div id="cargando-texto" class="cargando">Cargando...</div>
    <div class="grid-galeria" id="contenedor-galeria"></div>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

    <script>
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDzqk_-hYbnazbaXgwWgmdD5hVbMxJ_6nVqbVRIUY53wAKyXLAjIpNzHVu9EqcCppH/exec"; 

      const urlParams = new URLSearchParams(window.location.search);
      const TITULO = urlParams.get('t') || "Galería Privada";
      const SUBTITULO = urlParams.get('s') || "Sesión";
      const ID_PORTADA = urlParams.get('p');
      const DATA_COMPRIMIDA = urlParams.get('data');
      const ID_CARPETA = urlParams.get('folder'); 

      document.getElementById('txt-titulo').innerText = TITULO;
      document.getElementById('txt-subtitulo').innerText = SUBTITULO;
      document.getElementById('html-title').innerText = TITULO;

      if (ID_PORTADA) {
        document.documentElement.style.setProperty('--url-portada', `url(https://drive.google.com/thumbnail?id=${ID_PORTADA}&sz=w2500)`);
      }

      let todasLasFotos = [];
      let indiceActual = 0;
      const FOTOS_POR_LOTE = 15;
      let columnasGlobales = [];

      // LÓGICA DE CARGA ULTRA-RÁPIDA
      if (DATA_COMPRIMIDA) {
          try {
              // Descomprime los datos del link (Base64 a JSON)
              todasLasFotos = JSON.parse(decodeURIComponent(escape(atob(DATA_COMPRIMIDA))));
              document.getElementById("cargando-texto").style.display = "none";
              document.getElementById("barra-acciones").style.display = "flex";
              iniciarGaleria();
          } catch (e) {
              console.error("Error decodificando data", e);
          }
      } else if (ID_CARPETA) {
          // Respaldo lento si no hay data
          fetch(`${WEB_APP_URL}?folder=${ID_CARPETA}`)
            .then(res => res.json())
            .then(data => {
              document.getElementById("cargando-texto").style.display = "none";
              todasLasFotos = data;
              document.getElementById("barra-acciones").style.display = "flex";
              iniciarGaleria();
            });
      }

      function iniciarGaleria() {
        const contenedor = document.getElementById("contenedor-galeria");
        contenedor.innerHTML = "";
        let numCols = window.innerWidth > 768 ? 3 : 2;
        for (let i = 0; i < numCols; i++) {
          let col = document.createElement("div");
          col.className = "columna-masonry";
          contenedor.appendChild(col);
          columnasGlobales.push(col);
        }
        cargarSiguienteLote();
      }

      function cargarSiguienteLote() {
        let lote = todasLasFotos.slice(indiceActual, indiceActual + FOTOS_POR_LOTE);
        if (lote.length === 0) return;

        lote.forEach((foto, i) => {
          const enlace = document.createElement("a");
          enlace.href = `https://drive.google.com/uc?export=view&id=${foto.id}`;
          enlace.className = "glightbox foto-link";
          const img = document.createElement("img");
          img.src = `https://drive.google.com/thumbnail?id=${foto.id}&sz=w600`;
          img.className = "foto-img";
          enlace.appendChild(img);
          columnasGlobales[(indiceActual + i) % columnasGlobales.length].appendChild(enlace);
        });

        indiceActual += FOTOS_POR_LOTE;
        GLightbox({ selector: '.glightbox' });
      }

      window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
          cargarSiguienteLote();
        }
      };
    </script>
</body>
</html>
