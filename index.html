<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="html-title">Cargando Galería...</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <link rel="stylesheet" href="style.css" />
    
    <style>
        :root { --url-portada: none; }
        
        /* Cargador centrado verticalmente pero un poco arriba del título principal */
        .loader-container { 
            position: fixed;
            top: 40%; /* Bajado del tope, pero arriba del centro total */
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            letter-spacing: 6px;
            color: #ffffff; /* Blanco para que resalte sobre el fondo oscuro de la portada */
            text-transform: uppercase;
            z-index: 1001;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header-galeria::before { 
            background-image: var(--url-portada) !important; 
            background-color: #111; 
        }
        
        /* Prevenir que se vea el "undefined" si tarda en cargar */
        #txt-titulo, #txt-subtitulo { min-height: 1em; }
    </style>
</head>
<body>

    <div id="loader" class="loader-container">Cargando</div>

    <div class="header-galeria" id="header-portada">
      <div class="titulo" id="txt-titulo"></div>
      <div class="subtitulo" id="txt-subtitulo"></div>
      <img src="https://drive.google.com/thumbnail?id=1hpQGY_QfG4VAE4g8VJRTAYAXUWE-XtOB&sz=w200" class="logo-header">
    </div>

    <div class="contenedor-video" id="seccion-video" style="display: none;">
        <div class="video-columna">
            <div class="video-wrapper">
                <iframe id="iframe-video" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div class="grid-galeria" id="contenedor-galeria"></div>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

    <script>
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyI_eOY3aNOYfmRXoOUJqMmoMkCXh__kemfbGk2MfBAzf9uXUVMvGKwlrWwaeIo_raN/exec"; 
      const urlParams = new URLSearchParams(window.location.search);
      const folderId = urlParams.get('f');

      if (folderId) {
          // Intentar leer la configuración guardada
          fetch(`${WEB_APP_URL}?folder=${folderId}&action=read`)
            .then(res => res.json())
            .then(config => {
                
                if(!config || config.error) {
                    document.getElementById('loader').innerText = "Configura esta galería en el Admin";
                    setTimeout(() => { document.getElementById('loader').style.display = "none"; }, 3000);
                    return;
                }
                
                // Aplicar Títulos
                document.getElementById('txt-titulo').innerText = config.t || "";
                document.getElementById('txt-subtitulo').innerText = config.s || "";
                document.getElementById('html-title').innerText = config.t ? (config.t + " | AlexDHZ") : "Galería";

                // Aplicar Portada
                if(config.p) {
                    document.documentElement.style.setProperty('--url-portada', `url(https://drive.google.com/thumbnail?id=${config.p}&sz=w2500)`);
                }
                
                // Aplicar Video
                if(config.v) {
                    document.getElementById('seccion-video').style.display = "flex";
                    document.getElementById('iframe-video').src = `https://drive.google.com/file/d/${config.v}/preview`;
                }

                // Renderizar fotos
                if(config.fotos && config.fotos.length > 0) {
                    const contenedor = document.getElementById("contenedor-galeria");
                    let numCols = window.innerWidth > 768 ? 3 : 2;
                    let columnas = [];
                    
                    for (let i = 0; i < numCols; i++) {
                        let col = document.createElement("div"); 
                        col.className = "columna-masonry";
                        contenedor.appendChild(col); 
                        columnas.push(col);
                    }

                    config.fotos.forEach((f, i) => {
                        const a = document.createElement("a");
                        a.href = `https://drive.google.com/uc?export=view&id=${f.id}`;
                        a.className = "glightbox foto-link";
                        const img = document.createElement("img");
                        img.src = `https://drive.google.com/thumbnail?id=${f.id}&sz=w800`;
                        img.className = "foto-img";
                        a.appendChild(img);
                        columnas[i % numCols].appendChild(a);
                    });
                    
                    GLightbox({ selector: '.glightbox', touchNavigation: true, loop: true });
                }

                // Éxito: quitar cargador
                document.getElementById('loader').style.display = "none";
            })
            .catch(err => {
                console.error("Error:", err);
                document.getElementById('loader').innerText = "Error al conectar";
                setTimeout(() => { document.getElementById('loader').style.display = "none"; }, 2000);
            });
      } else {
          document.getElementById('loader').innerText = "Link Inválido";
      }
    </script>
</body>
</html>
