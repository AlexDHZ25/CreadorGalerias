<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin | AlexDHZ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #333; }
        #resultado { display: none; margin-top: 25px; padding: 15px; background: #f8f9fa; border: 1px dashed #007bff; border-radius: 8px; }
        #url-final { font-size: 12px; word-break: break-all; color: #007bff; display: block; margin-bottom: 10px; font-family: monospace; }
        .btn-copiar { background: #007bff; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Nueva Galería</h2>
        
        <label>ID CARPETA GOOGLE DRIVE</label>
        <input type="text" id="f" placeholder="Ej: 1A2b3C4d5E6f...">

        <label>NOMBRE DEL CLIENTE</label>
        <input type="text" id="t" placeholder="Ej: CONSTANZA">

        <label>EVENTO / SUBTÍTULO</label>
        <input type="text" id="s" placeholder="Ej: MIS XV AÑOS">

        <label>ID FOTO PORTADA</label>
        <input type="text" id="p" placeholder="ID de la foto principal">

        <label>ID VIDEO (OPCIONAL)</label>
        <input type="text" id="v" placeholder="ID del video en Drive">

        <button onclick="generarLink()">GENERAR ENLACE CORTO</button>

        <div id="resultado">
            <label>Link listo para enviar:</label>
            <span id="url-final"></span>
            <button class="btn-copiar" onclick="copiar()">COPIAR LINK</button>
        </div>
    </div>

    <script>
        function generarLink() {
            const f = document.getElementById('f').value.trim();
            const t = document.getElementById('t').value.trim();
            const s = document.getElementById('s').value.trim();
            const p = document.getElementById('p').value.trim();
            const v = document.getElementById('v').value.trim();

            if(!f || !t) return alert("El ID de carpeta y Nombre son obligatorios");

            const baseUrl = "https://alexdhzgaleries.netlify.app/";
            const query = `?f=${f}&t=${encodeURIComponent(t)}&s=${encodeURIComponent(s)}&p=${p}&v=${v}`;
            const linkFinal = baseUrl + query;

            document.getElementById('url-final').innerText = linkFinal;
            document.getElementById('resultado').style.display = "block";
        }

        function copiar() {
            const link = document.getElementById('url-final').innerText;
            navigator.clipboard.writeText(link).then(() => alert("¡Copiado!"));
        }
    </script>
</body>
</html>
