<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Generador de Galerías AlexDHZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { margin: 0 0 20px 0; font-size: 22px; color: #1a1a1a; border-bottom: 2px solid #eee; padding-bottom: 15px; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: border 0.3s; }
        input:focus { border-color: #000; outline: none; }
        button { width: 100%; padding: 16px; background: #000; color: #fff; border: none; border-radius: 8px; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        button:hover { background: #333; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        #link-generado { margin-top: 30px; padding: 20px; background: #f8fbff; border-radius: 10px; border: 1px dashed #007bff; display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #url-final { font-size: 11px; word-break: break-all; font-family: monospace; background: #fff; padding: 12px; border: 1px solid #dce8f5; display: block; margin: 15px 0; border-radius: 4px; color: #004085; }
        .btn-copy { background: #007bff; padding: 10px; font-size: 12px; margin-top: 5px; }
        .btn-copy:hover { background: #0056b3; }
        .hint { font-size: 10px; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Generador de Enlaces</h2>
        
        <label>1. ID de la Carpeta (Google Drive)</label>
        <input type="text" id="folderId" placeholder="Pega el ID de la carpeta aquí">
        <div class="hint">Asegúrate que la carpeta sea pública en Drive</div>

        <label>2. Nombre del Cliente / Título</label>
        <input type="text" id="titulo" placeholder="Ej: CONSTANZA">

        <label>3. Subtítulo (Evento)</label>
        <input type="text" id="subtitulo" placeholder="Ej: MIS XV">

        <label>4. ID Foto de Portada (Header)</label>
        <input type="text" id="portadaId" placeholder="ID de la imagen principal">

        <label>5. ID de Video (Opcional)</label>
        <input type="text" id="videoId" placeholder="ID del video en Drive">
        
        <button id="btnGenerar" onclick="generarEnlace()">GENERAR GALERÍA INSTANTÁNEA</button>

        <div id="link-generado">
            <span style="font-size: 12px; color: #007bff; font-weight: bold;">Enlace para el cliente:</span>
            <code id="url-final"></code>
            <button class="btn-copy" onclick="copiar()">COPIAR ENLACE</button>
            <div class="hint" style="text-align: center; margin-top: 10px;">¡Este link carga las fotos al instante!</div>
        </div>
    </div>

    <script>
        async function generarEnlace() {
            const btn = document.getElementById('btnGenerar');
            const f = document.getElementById('folderId').value.trim();
            const t = document.getElementById('titulo').value.trim();
            const s = document.getElementById('subtitulo').value.trim();
            const p = document.getElementById('portadaId').value.trim();
            const v = document.getElementById('videoId').value.trim();

            if(!f || !t) { 
                alert("Por favor, ingresa al menos el ID de carpeta y el Nombre."); 
                return; 
            }

            btn.disabled = true;
            btn.innerText = "Sincronizando con Drive...";

            // TU URL DE GOOGLE APPS SCRIPT
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDzqk_-hYbnazbaXgwWgmdD5hVbMxJ_6nVqbVRIUY53wAKyXLAjIpNzHVu9EqcCppH/exec";

            try {
                // 1. Obtenemos los datos de las fotos desde Google
                const response = await fetch(`${WEB_APP_URL}?folder=${f}`);
                const fotos = await response.json();

                if (fotos.error) throw new Error(fotos.error);
                if (!Array.isArray(fotos) || fotos.length === 0) throw new Error("La carpeta parece estar vacía o no es pública.");

                // 2. Comprimimos los datos en Base64 para el enlace
                const dataString = JSON.stringify(fotos);
                const dataComprimida = btoa(unescape(encodeURIComponent(dataString)));

                // 3. Construimos la URL apuntando a la RAÍZ de tu Netlify
                const URL_BASE = "https://alexdhzgaleries.netlify.app/"; 
                const linkFinal = `${URL_BASE}?t=${encodeURIComponent(t)}&s=${encodeURIComponent(s)}&p=${p}&v=${v}&data=${dataComprimida}`;

                // 4. Mostramos el resultado
                document.getElementById('url-final').innerText = linkFinal;
                document.getElementById('link-generado').style.display = "block";
                
                // Desplazar hacia abajo para ver el link
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            } catch (err) {
                alert("Error crítico: " + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "GENERAR GALERÍA INSTANTÁNEA";
            }
        }

        function copiar() {
            const text = document.getElementById('url-final').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.querySelector('.btn-copy');
                copyBtn.innerText = "¡COPIADO!";
                setTimeout(() => copyBtn.innerText = "COPIAR ENLACE", 2000);
            });
        }
    </script>
</body>
</html>
