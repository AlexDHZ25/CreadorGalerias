<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | Generador Instantáneo</title>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: 20px; }
        h2 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 12px; font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #999; }
        #link-generado { margin-top: 20px; padding: 15px; background: #e8f4fd; border-radius: 6px; border: 1px dashed #2196f3; display: none; }
        #url-final { font-size: 10px; word-break: break-all; font-family: monospace; background: white; padding: 10px; border: 1px solid #d0e4f5; display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Generador de Galería Instantánea</h2>
        <label>ID Carpeta Google Drive</label>
        <input type="text" id="folderId" placeholder="ID de la carpeta">
        <label>Título (Nombre)</label>
        <input type="text" id="titulo" placeholder="Ej: CONSTANZA">
        <label>Subtítulo (Evento)</label>
        <input type="text" id="subtitulo" placeholder="Ej: MIS XV">
        <label>ID Foto Portada</label>
        <input type="text" id="portadaId" placeholder="ID de la foto del header">
        
        <button id="btnGenerar" onclick="generarEnlace()">GENERAR ENLACE RÁPIDO</button>

        <div id="link-generado">
            <span style="font-size: 11px; color: #2196f3; font-weight: bold;">¡Listo! El cliente no tendrá que esperar:</span>
            <code id="url-final"></code>
            <button style="background: #2196f3; padding: 8px; font-size: 11px;" onclick="copiar()">COPIAR ENLACE</button>
        </div>
    </div>

    <script>
        async function generarEnlace() {
            const btn = document.getElementById('btnGenerar');
            const f = document.getElementById('folderId').value.trim();
            const t = document.getElementById('titulo').value.trim();
            const s = document.getElementById('subtitulo').value.trim();
            const p = document.getElementById('portadaId').value.trim();

            if(!f || !t) { alert("Completa los campos."); return; }

            btn.disabled = true;
            btn.innerText = "Obteniendo datos de Drive...";

            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDzqk_-hYbnazbaXgwWgmdD5hVbMxJ_6nVqbVRIUY53wAKyXLAjIpNzHVu9EqcCppH/exec";

            try {
                const response = await fetch(`${WEB_APP_URL}?folder=${f}`);
                const fotos = await response.json();

                // Comprimimos la lista de fotos en Base64 para el link
                const dataString = JSON.stringify(fotos);
                const dataComprimida = btoa(unescape(encodeURIComponent(dataString)));

                // URL base (ajusta si tu index.html no está en la raíz)
                const URL_BASE = window.location.origin + window.location.pathname.replace('admin.html', '');
                const linkFinal = `${URL_BASE}?t=${encodeURIComponent(t)}&s=${encodeURIComponent(s)}&p=${p}&data=${dataComprimida}`;

                document.getElementById('url-final').innerText = linkFinal;
                document.getElementById('link-generado').style.display = "block";
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "GENERAR ENLACE RÁPIDO";
            }
        }

        function copiar() {
            const text = document.getElementById('url-final').innerText;
            navigator.clipboard.writeText(text).then(() => alert("Copiado al portapapeles"));
        }
    </script>
</body>
</html>
